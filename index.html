<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🥥 COCONUT GOLD 🥥</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --gold: #FFD700;
      --gold-light: #FFF0A0;
      --gold-deep: #B8860B;
      --gold-dark: #7B5800;
      --brown: #3B1F00;
      --cream: #FFF8E7;
      --coconut: #C8A96A;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a0e00;
      font-family: 'Cormorant Garamond', serif;
      color: var(--gold);
      overflow-x: hidden;
      min-height: 100vh;
      cursor: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><text y='28' font-size='28'>🥥</text></svg>") 16 16, auto;
    }

    /* ── Animated gold particle background ── */
    .bg-canvas {
      position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(ellipse at 20% 50%, #3a1800 0%, #1a0e00 60%),
                  radial-gradient(ellipse at 80% 20%, #2a1500 0%, transparent 50%);
    }
    .particle {
      position: fixed; border-radius: 50%;
      background: radial-gradient(circle, var(--gold) 0%, transparent 70%);
      animation: float linear infinite;
      pointer-events: none; z-index: 0;
    }

    @keyframes float {
      0%   { transform: translateY(110vh) rotate(0deg); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 0.6; }
      100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
    }

    /* ── Main container ── */
    .wrapper {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; align-items: center;
      padding: 40px 20px 80px;
      min-height: 100vh;
    }

    /* ── Header ── */
    header { text-align: center; margin-bottom: 50px; animation: fadeDown .9s ease both; }

    .crown { font-size: 3rem; display: block; margin-bottom: -10px; animation: spin 8s linear infinite; }
    @keyframes spin { 0%,100%{transform:rotate(-5deg)} 50%{transform:rotate(5deg)} }

    h1 {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(2.5rem, 8vw, 5.5rem);
      font-weight: 900;
      background: linear-gradient(135deg, #7B5800 0%, #FFD700 30%, #FFF0A0 50%, #FFD700 70%, #B8860B 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
      letter-spacing: 0.05em;
      line-height: 1.1;
      filter: drop-shadow(0 0 30px rgba(255,215,0,0.5));
    }

    .subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.3rem;
      color: var(--coconut);
      letter-spacing: 0.3em;
      margin-top: 8px;
      opacity: 0.85;
    }

    /* ── Coconut emblem ── */
    .emblem {
      font-size: 6rem;
      display: block;
      margin: 10px auto 30px;
      filter: drop-shadow(0 0 20px rgba(255,215,0,0.8));
      animation: pulse 3s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { transform: scale(1); filter: drop-shadow(0 0 20px rgba(255,215,0,0.6)); }
      50%      { transform: scale(1.08); filter: drop-shadow(0 0 40px rgba(255,215,0,1)); }
    }

    /* ── Divider ── */
    .divider {
      width: 300px; height: 2px; margin: 10px auto 40px;
      background: linear-gradient(90deg, transparent, var(--gold), #FFF0A0, var(--gold), transparent);
      border-radius: 2px;
      box-shadow: 0 0 12px rgba(255,215,0,0.6);
    }

    /* ── Buttons ── */
    .btn-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      max-width: 700px;
      width: 100%;
      margin-bottom: 40px;
      animation: fadeUp .9s .3s ease both;
    }

    .btn {
      position: relative; overflow: hidden;
      padding: 18px 28px;
      border: 2px solid var(--gold-deep);
      border-radius: 4px;
      background: linear-gradient(145deg, rgba(60,30,0,0.9), rgba(30,12,0,0.95));
      color: var(--gold);
      font-family: 'Cinzel Decorative', serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(255,215,0,0.15), inset 0 1px 0 rgba(255,215,0,0.1);
    }

    .btn::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,215,0,0.15) 0%, transparent 60%);
      opacity: 0; transition: opacity 0.3s;
    }
    .btn:hover::before { opacity: 1; }

    .btn::after {
      content: '';
      position: absolute; top: 50%; left: 50%;
      width: 0; height: 0;
      background: rgba(255,215,0,0.25);
      border-radius: 50%;
      transform: translate(-50%,-50%);
      transition: width .5s ease, height .5s ease, opacity .5s ease;
      opacity: 0;
    }
    .btn:active::after { width: 300px; height: 300px; opacity: 0; }

    .btn:hover {
      border-color: var(--gold);
      color: var(--gold-light);
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(255,215,0,0.35), inset 0 1px 0 rgba(255,215,0,0.2);
    }

    .btn.primary {
      background: linear-gradient(145deg, #7B5800, #3a2000);
      border-color: var(--gold);
    }
    .btn.primary:hover {
      background: linear-gradient(145deg, #B8860B, #7B5800);
      box-shadow: 0 8px 40px rgba(255,215,0,0.5);
    }

    .btn-icon { margin-right: 8px; font-size: 1.1em; }

    /* ── Secret button (hidden, revealed on hover near bottom-right) ── */
    .secret-zone {
      position: fixed;
      bottom: 20px; right: 20px;
      width: 50px; height: 50px;
      z-index: 10;
    }
    .secret-btn {
      position: absolute; inset: 0;
      border: 1px solid rgba(255,215,0,0.08);
      border-radius: 50%;
      background: rgba(255,215,0,0.03);
      cursor: pointer;
      transition: all 0.4s ease;
      font-size: 0;
      color: transparent;
    }
    .secret-btn:hover, .secret-btn.revealed {
      background: rgba(255,215,0,0.15);
      border-color: var(--gold);
      font-size: 1.5rem;
      color: var(--gold);
      box-shadow: 0 0 20px rgba(255,215,0,0.6);
      transform: scale(1.2);
    }
    .secret-hint {
      position: absolute; right: 60px; bottom: 10px;
      white-space: nowrap;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.8rem;
      color: rgba(255,215,0,0.35);
      opacity: 0;
      transition: opacity 0.4s;
      pointer-events: none;
    }
    .secret-zone:hover .secret-hint { opacity: 1; }

    /* ── Notification toast ── */
    .toast {
      position: fixed; bottom: 80px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: linear-gradient(135deg, rgba(60,30,0,0.98), rgba(30,12,0,0.98));
      border: 1px solid var(--gold);
      color: var(--gold-light);
      font-family: 'Cinzel Decorative', serif;
      font-size: 0.8rem;
      padding: 14px 28px;
      border-radius: 4px;
      box-shadow: 0 0 30px rgba(255,215,0,0.4);
      opacity: 0;
      transition: all 0.4s ease;
      z-index: 999;
      pointer-events: none;
      text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Info section ── */
    .info-card {
      max-width: 600px; width: 100%;
      border: 1px solid rgba(255,215,0,0.2);
      border-radius: 4px;
      padding: 30px;
      background: rgba(20,10,0,0.7);
      backdrop-filter: blur(4px);
      margin-top: 10px;
      animation: fadeUp .9s .5s ease both;
    }
    .info-card h2 {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1rem;
      letter-spacing: 0.2em;
      color: var(--gold);
      margin-bottom: 12px;
    }
    .info-card p {
      font-size: 1.05rem;
      line-height: 1.8;
      color: var(--coconut);
      font-style: italic;
    }

    /* ── Gold bar ornament ── */
    .ornament {
      font-size: 1.5rem;
      letter-spacing: 0.5em;
      color: rgba(255,215,0,0.4);
      margin: 30px 0 10px;
    }

    @keyframes fadeDown { from{opacity:0;transform:translateY(-30px)} to{opacity:1;transform:none} }
    @keyframes fadeUp   { from{opacity:0;transform:translateY(30px)}  to{opacity:1;transform:none} }

    /* ── Shimmer overlay on main title ── */
    .shimmer-wrap { position: relative; display: inline-block; }
    .shimmer-wrap::after {
      content: '';
      position: absolute; top: 0; left: -100%;
      width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      animation: shimmer 3.5s linear infinite;
      pointer-events: none;
    }
    @keyframes shimmer { to { left: 200%; } }
  </style>
</head>
<body>

<div class="bg-canvas" id="bgCanvas"></div>

<div class="wrapper">
  <header>
    <span class="crown">👑</span>
    <div class="shimmer-wrap">
      <h1>COCONUT<br/>GOLD</h1>
    </div>
    <p class="subtitle">✦ the golden island experience ✦</p>
  </header>

  <span class="emblem">🥥</span>
  <div class="divider"></div>

  <div class="btn-grid">
    <button class="btn primary" onclick="playCoconutSong()">
      <span class="btn-icon">🎵</span> Play the Song
    </button>
    <button class="btn" onclick="crackCoconut()">
      <span class="btn-icon">🥥</span> Crack a Coconut
    </button>
    <button class="btn" onclick="sipDrink()">
      <span class="btn-icon">🍹</span> Sip a Drink
    </button>
    <button class="btn" onclick="goldenShower()">
      <span class="btn-icon">✨</span> Golden Rain
    </button>
    <button class="btn" onclick="danceTropics()">
      <span class="btn-icon">💃</span> Dance Tropically
    </button>
    <button class="btn" onclick="findTreasure()">
      <span class="btn-icon">🏴‍☠️</span> Find Treasure
    </button>
  </div>

  <div class="info-card">
    <h2>✦ About Coconut Gold ✦</h2>
    <p>
      Where the tropics meet the luxury of gold — a land of endless sun,
      crystalline shores, and coconuts dripping with liquid amber.
      Every sip, every beat, every grain of sand is pure gold.
    </p>
  </div>

  <div class="ornament">⬡ ⬡ ⬡</div>
</div>

<!-- Secret Button -->
<div class="secret-zone" id="secretZone">
  <button class="secret-btn" id="secretBtn" onclick="triggerSecret()" title="">🌴</button>
  <span class="secret-hint">psst… click me…</span>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  // ── Floating particles ──
  const canvas = document.getElementById('bgCanvas');
  for (let i = 0; i < 35; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 6 + 2;
    p.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*100}%;
      animation-duration:${6 + Math.random()*12}s;
      animation-delay:${Math.random()*12}s;
      opacity:${Math.random()*0.5+0.2};
    `;
    canvas.appendChild(p);
  }

  // ── Toast helper ──
  function showToast(msg, duration=2800) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), duration);
  }

  // ── Button actions ──
  function playCoconutSong() {
    showToast('🎵 Taking you to the COCONUT SONG! 🥥');
    setTimeout(() => {
      window.open('https://www.youtube.com/watch?v=6eSid-8WNwY', '_blank');
    }, 900);
  }

  function crackCoconut() {
    showToast('💥 CRACK! Golden coconut water everywhere! 🥥✨');
    burst(6);
  }

  function sipDrink() {
    showToast('🍹 Mmm… tropical gold in every sip…');
    burst(4);
  }

  function goldenShower() {
    showToast('✨ Golden rain descends upon you! ☀️');
    burst(20);
  }

  function danceTropics() {
    const emojis = ['💃','🕺','🌴','🥥','🎶','✨'];
    showToast(emojis.join(' ') + ' DANCE! ' + emojis.reverse().join(' '));
    document.querySelector('.emblem').style.animation = 'spin 0.3s linear infinite';
    setTimeout(() => {
      document.querySelector('.emblem').style.animation = 'pulse 3s ease-in-out infinite';
    }, 3000);
  }

  function findTreasure() {
    showToast('🏴‍☠️ X marks the spot… the treasure is COCONUT GOLD! 💛');
    burst(10);
  }

  // ── Burst effect ──
  function burst(count) {
    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.textContent = ['🥥','✨','💛','🌴','⭐'][Math.floor(Math.random()*5)];
      el.style.cssText = `
        position:fixed; font-size:${1.5+Math.random()*1.5}rem;
        left:${20+Math.random()*60}%; top:${20+Math.random()*40}%;
        pointer-events:none; z-index:999;
        animation: burstAnim 1.4s ease-out forwards;
        animation-delay:${Math.random()*0.4}s;
      `;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2000);
    }
  }
  const burstStyle = document.createElement('style');
  burstStyle.textContent = `
    @keyframes burstAnim {
      0%   { opacity:1; transform: translate(0,0) scale(1); }
      100% { opacity:0; transform: translate(${['-','+'][Math.round(Math.random())]}${50+Math.random()*80}px, -${80+Math.random()*120}px) scale(0.3) rotate(${Math.random()*360}deg); }
    }
  `;
  document.head.appendChild(burstStyle);

  // ── Secret button reveal on hover zone ──
  const secretBtn = document.getElementById('secretBtn');
  // Make it slightly visible after 5 seconds so users can find it
  setTimeout(() => secretBtn.classList.add('revealed'), 5000);
  setTimeout(() => secretBtn.classList.remove('revealed'), 7500);

  function triggerSecret() {
    showToast('🌴 YOU FOUND THE SECRET! 🥥👑 Sending you to the COCONUT SONG!', 3500);
    burst(18);
    // Gold flash
    const flash = document.createElement('div');
    flash.style.cssText = `
      position:fixed; inset:0; background:rgba(255,215,0,0.18);
      pointer-events:none; z-index:998;
      animation: flashFade 1s ease-out forwards;
    `;
    document.body.appendChild(flash);
    const fs = document.createElement('style');
    fs.textContent = `@keyframes flashFade { 0%{opacity:1} 100%{opacity:0} }`;
    document.head.appendChild(fs);
    setTimeout(() => flash.remove(), 1200);

    setTimeout(() => {
      window.open('https://www.youtube.com/watch?v=6eSid-8WNwY', '_blank');
    }, 1500);
  }
</script>
</body>
</html>
