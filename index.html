<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fast Python Runner</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"></script>
    <style>
        :root { --bg: #1e1e1e; --editor: #282c34; --out: #1e1e1e; --accent: #007bff; --text: #d4d4d4; --input-line: #3c3c3c; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: #121212; color: var(--text); }
        header { background: #252526; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        h1 { margin: 0; font-size: 1.1rem; color: #fff; }
        .status { font-size: 0.8rem; padding: 4px 8px; border-radius: 4px; background: #333; color: #aaa; }
        .status.ready { background: #2d5632; color: #fff; }
        .btn { background: var(--accent); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
        .btn:disabled { background: #444; cursor: not-allowed; }
        .container { display: flex; flex: 1; }
        .editor-panel { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #333; }
        .output-panel { flex: 1; display: flex; flex-direction: column; background: var(--out); position: relative; }
        .label { background: #2d2d2d; padding: 8px; font-size: 0.8rem; font-weight: bold; color: #999; text-transform: uppercase; border-bottom: 1px solid #333; }
        textarea#code-editor { flex: 1; border: none; padding: 15px; font-family: 'Consolas', 'Monaco', monospace; font-size: 0.95rem; background: var(--editor); color: #d4d4d4; resize: none; outline: none; line-height: 1.5; }
        #output { flex: 1; padding: 15px; font-family: 'Consolas', 'Monaco', monospace; font-size: 0.95rem; overflow-y: auto; color: #d4d4d4; white-space: pre-wrap; }
        .error { color: #f48771; }
        
        /* Fast Input UI */
        #input-bar { 
            display: none; 
            position: absolute; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            background: #252526; 
            padding: 10px 15px; 
            border-top: 1px solid #444; 
            z-index: 100;
        }
        #prompt-text { color: #4ec9b0; font-family: 'Consolas', monospace; margin-right: 10px; }
        #user-input { 
            background: transparent; 
            border: none; 
            color: #fff; 
            font-family: 'Consolas', monospace; 
            font-size: 1rem; 
            flex: 1; 
            outline: none; 
        }
    </style>
</head>
<body>

<header>
    <h1>Fast Python Runner</h1>
    <div style="display: flex; gap: 10px; align-items: center;">
        <span id="status" class="status">Loading...</span>
        <button id="runBtn" class="btn" disabled>▶ Run</button>
    </div>
</header>

<div class="container">
    <div class="editor-panel">
        <div class="label">Python Code</div>
        <textarea id="code-editor" spellcheck="false"># Calculator Code
def add(x, y): return x + y
def subtract(x, y): return x - y
def multiply(x, y): return x * y
def divide(x, y): return x / y

print("Select operation.")
print("1. Add")
print("2. Subtract")
print("3. Multiply")
print("4. Divide")

while True:
    choice = input("Enter choice(1/2/3/4): ")
    if choice in ('1', '2', '3', '4'):
        try:
            num1 = float(input("Enter first number: "))
            num2 = float(input("Enter second number: "))
        except ValueError:
            print("Invalid input. Please enter a number.")
            continue

        if choice == '1':
            print(num1, "+", num2, "=", add(num1, num2))
        elif choice == '2':
            print(num1, "-", num2, "=", subtract(num1, num2))
        elif choice == '3':
            print(num1, "*", num2, "=", multiply(num1, num2))
        elif choice == '4':
            print(num1, "/", num2, "=", divide(num1, num2))
        
        next_calculation = input("Let's do next calculation? (yes/no): ")
        if next_calculation == "no":
          break
    else:
        print("Invalid Input")
</textarea>
    </div>
    <div class="output-panel">
        <div class="label">Console Output</div>
        <div id="output"></div>
        
        <!-- Fast Input Bar -->
        <div id="input-bar">
            <span id="prompt-text">$</span>
            <input type="text" id="user-input" autocomplete="off" autofocus>
        </div>
    </div>
</div>

<script>
    const codeEl = document.getElementById('code-editor');
    const outEl = document.getElementById('output');
    const runBtn = document.getElementById('runBtn');
    const statusEl = document.getElementById('status');
    
    const inputBar = document.getElementById('input-bar');
    const promptText = document.getElementById('prompt-text');
    const userInput = document.getElementById('user-input');
    
    let pyodide = null;
    let inputCallback = null; // Function to call when input is ready
    let isWaitingForInput = false;

    // --- 1. Load Pyodide ---
    async function initPyodide() {
        try {
            if (typeof loadPyodide === 'undefined') throw new Error("Script not loaded");
            pyodide = await loadPyodide();
            
            // Set up stdout
            pyodide.setStdout({ batched: (m) => outEl.innerHTML += m + "\n" });
            pyodide.setStderr({ batched: (m) => outEl.innerHTML += `<span class="error">${m}</span>\n` });
            
            // Set up stdin (The Fast Way)
            // We intercept the stdin read. If we are waiting for input, we return the value.
            // Otherwise, we block until the user types.
            pyodide.setStdin({
                getChar: (blocking) => {
                    if (!isWaitingForInput) return -1; // No input requested
                    
                    // This is a hack to make it work with the async nature of JS
                    // We return a special character to signal "wait"
                    // But Pyodide's stdin is tricky.
                    // Better approach: Override the input() function in Python to call a JS function
                    return -1; 
                }
            });

            // Instead of stdin, we override input() directly in Python globals
            // We use a simple Promise-based approach that is fast
            pyodide.globals.set("js_request_input", (prompt) => {
                return new Promise((resolve) => {
                    isWaitingForInput = true;
                    promptText.textContent = prompt || "$ ";
                    inputBar.style.display = 'flex';
                    userInput.value = '';
                    userInput.focus();
                    
                    // Store the resolver
                    inputCallback = resolve;
                });
            });

            await pyodide.runPythonAsync(`
                def fast_input(prompt=""):
                    # Call JS function, wait for promise, return result
                    return js_request_input(prompt)
                
                input = fast_input
            `);
            
            statusEl.textContent = "Ready (Fast)";
            statusEl.className = "status ready";
            runBtn.disabled = false;
            return true;
        } catch (e) {
            console.error("Init failed:", e);
            statusEl.textContent = "Error";
            outEl.innerHTML = `<span class="error">${e.message}</span>`;
            return false;
        }
    }

    // --- 2. Handle Input ---
    userInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            const val = userInput.value;
            userInput.value = '';
            inputBar.style.display = 'none';
            isWaitingForInput = false;
            
            // Print the input to the console (mimic VS Code)
            outEl.innerHTML += val + "\n";
            
            // Resolve the promise
            if (inputCallback) {
                inputCallback(val);
                inputCallback = null;
            }
        }
    });

    // --- 3. Run Code ---
    async function runCode() {
        outEl.innerHTML = '';
        runBtn.disabled = true;
        runBtn.textContent = "Running...";
        
        try {
            if (pyodide) {
                await pyodide.runPythonAsync(codeEl.value);
            }
        } catch (err) {
            outEl.innerHTML += `<span class="error">${err}</span>\n`;
        } finally {
            runBtn.disabled = false;
            runBtn.textContent = "▶ Run";
        }
    }

    // --- Init ---
    initPyodide();
    runBtn.addEventListener('click', runCode);

</script>

</body>
</html>
