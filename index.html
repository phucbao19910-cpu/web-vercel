<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Python Runner (VS Code Style)</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"></script>
    <style>
        :root { --bg: #1e1e1e; --editor: #282c34; --out: #1e1e1e; --accent: #007bff; --text: #d4d4d4; --input-line: #3c3c3c; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: #121212; color: var(--text); }
        header { background: #252526; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        h1 { margin: 0; font-size: 1.1rem; color: #fff; }
        .status { font-size: 0.8rem; padding: 4px 8px; border-radius: 4px; background: #333; color: #aaa; }
        .status.ready { background: #2d5632; color: #fff; }
        .status.error { background: #5a0000; color: #ff6b6b; }
        .btn { background: var(--accent); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
        .btn:disabled { background: #444; cursor: not-allowed; }
        .container { display: flex; flex: 1; }
        .editor-panel { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #333; }
        .output-panel { flex: 1; display: flex; flex-direction: column; background: var(--out); position: relative; }
        .label { background: #2d2d2d; padding: 8px; font-size: 0.8rem; font-weight: bold; color: #999; text-transform: uppercase; border-bottom: 1px solid #333; }
        textarea#code-editor { flex: 1; border: none; padding: 15px; font-family: 'Consolas', 'Monaco', monospace; font-size: 0.95rem; background: var(--editor); color: #d4d4d4; resize: none; outline: none; line-height: 1.5; }
        #output { flex: 1; padding: 15px; font-family: 'Consolas', 'Monaco', monospace; font-size: 0.95rem; overflow-y: auto; color: #d4d4d4; white-space: pre-wrap; }
        .error { color: #f48771; }
        
        /* Custom Input UI */
        #custom-input-container { 
            display: none; 
            position: absolute; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            background: var(--input-line); 
            padding: 10px; 
            border-top: 1px solid #444; 
            z-index: 100;
        }
        #custom-input-label { color: #9cdcfe; font-family: 'Consolas', monospace; margin-right: 10px; display: inline-block; }
