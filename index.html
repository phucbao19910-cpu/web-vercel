<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Python Runner (Real or Simulated)</title>
    <!-- Try to load Pyodide (Real Python) -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"></script>
    <style>
        :root { --bg: #f4f4f9; --editor: #282c34; --out: #1e1e1e; --accent: #007bff; }
        body { font-family: system-ui, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: var(--bg); }
        header { background: white; padding: 1rem; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; font-size: 1.2rem; color: #333; }
        .status { font-size: 0.8rem; padding: 4px 8px; border-radius: 4px; background: #eee; }
        .status.ready { background: #d4edda; color: #155724; }
        .status.sim { background: #fff3cd; color: #856404; }
        .btn { background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .container { display: flex; flex: 1; padding: 1rem; gap: 1rem; }
        .panel { flex: 1; display: flex; flex-direction: column; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); overflow: hidden; }
        .label { background: #eee; padding: 8px; font-size: 0.8rem; font-weight: bold; color: #555; text-transform: uppercase; }
        textarea { flex: 1; border: none; padding: 1rem; font-family: 'Consolas', monospace; background: var(--editor); color: #abb2bf; resize: none; outline: none; }
        #output { flex: 1; padding: 1rem; font-family: 'Consolas', monospace; background: var(--out); color: #e5e5e5; overflow-y: auto; white-space: pre-wrap; }
        .error { color: #ff4d4d; }
    </style>
</head>
<body>

<header>
    <h1>Python Runner</h1>
    <div style="display: flex; gap: 10px; align-items: center;">
        <span id="status" class="status">Loading...</span>
        <button id="runBtn" class="btn" disabled>▶ Run</button>
    </div>
</header>

<div class="container">
    <div class="panel">
        <div class="label">Python Code</div>
        <textarea id="code" spellcheck="false"># Try real Python commands:
import math
import random

name = input("What is your name? ")
age = int(input("How old are you? "))

print(f"Hello {name}!")
print(f"Next year you will be {age + 1}.")
print(f"Square root of 16: {math.sqrt(16)}")
print(f"Random number: {random.randint(1, 100)}")
</textarea>
    </div>
    <div class="panel">
        <div class="label">Console Output</div>
        <div id="output"></div>
    </div>
</div>

<script>
    const codeEl = document.getElementById('code');
    const outEl = document.getElementById('output');
    const runBtn = document.getElementById('runBtn');
    const statusEl = document.getElementById('status');
    
    let pyodide = null;
    let mode = 'sim'; // 'pyodide' or 'sim'

    // --- 1. Try to load Real Python (Pyodide) ---
    async function initPyodide() {
        try {
            if (typeof loadPyodide === 'undefined') throw new Error("Script not loaded");
            pyodide = await loadPyodide();
            
            // Override input() to use browser prompt
            await pyodide.runPythonAsync(`
                import js
                def input(prompt=""):
                    return js.prompt(prompt) or ""
            `);
            
            pyodide.setStdout({ batched: (m) => outEl.innerHTML += m + "\n" });
            pyodide.setStderr({ batched: (m) => outEl.innerHTML += `<span class="error">${m}</span>\n` });
            
            mode = 'pyodide';
            statusEl.textContent = "Ready (Real Python)";
            statusEl.className = "status ready";
            runBtn.disabled = false;
            return true;
        } catch (e) {
            console.warn("Pyodide failed:", e);
            return false;
        }
    }

    // --- 2. Fallback Simulation (If Pyodide fails) ---
    function runSimulation() {
        const code = codeEl.value;
        const lines = code.split('\n');
        let output = [];
        let variables = {};
        
        try {
            for (let line of lines) {
                line = line.trim();
                if (!line || line.startsWith('#')) continue;

                // Handle input()
                if (line.match(/.*=\s*int\s*\(\s*input\s*\(/)) {
                    const promptMatch = line.match(/input\s*\(\s*['"](.*)['"]\s*\)/);
                    const promptText = promptMatch ? promptMatch[1] : "";
                    const varMatch = line.match(/^(\w+)\s*=/);
                    const varName = varMatch ? varMatch[1] : "unknown";
                    
                    const val = prompt(promptText);
                    if (val === null) throw new Error("User cancelled");
                    const num = parseInt(val);
                    if (isNaN(num)) throw new Error(`ValueError: invalid literal for int() with base 10: '${val}'`);
                    variables[varName] = num;
                    continue;
                }

                // Handle print()
                if (line.startsWith('print(')) {
                    let content = line.slice(6, -1); // remove print( and )
                    // Simple string handling
                    if ((content.startsWith("'") && content.includes("'")) || (content.startsWith('"') && content.includes('"'))) {
                        let q = content[0];
                        let txt = content.slice(1, content.lastIndexOf(q));
                        // Replace {var}
                        txt = txt.replace(/\{(\w+)\}/g, (_, v) => variables[v] !== undefined ? variables[v] : `{${v}}`);
                        output.push(txt);
                    } else {
                        // Multiple args
                        let args = content.split(',').map(a => a.trim());
                        let res = args.map(a => {
                            if (variables[a] !== undefined) return variables[a];
                            if ((a[0]==='"' || a[0]==="'") && a.slice(-1)===a[0]) return a.slice(1, -1);
                            return a;
                        }).join(' ');
                        output.push(res);
                    }
                    continue;
                }

                // Handle simple assignment: x = 5
                if (line.includes('=')) {
                    let [k, v] = line.split('=').map(s => s.trim());
                    if (!isNaN(v)) variables[k] = Number(v);
                }
            }
            outEl.innerHTML = output.join('\n') + '\n';
        } catch (e) {
            outEl.innerHTML = `<span class="error">${e.message}</span>\n`;
        }
    }

    // --- Initialization ---
    async function init() {
        const success = await initPyodide();
        if (!success) {
            mode = 'sim';
            statusEl.textContent = "Running (Simulation Mode)";
            statusEl.className = "status sim";
            runBtn.disabled = false;
            outEl.innerHTML = "<span style='color:orange'>Note: Real Python blocked. Running in simulation mode.</span>\n";
        }
    }

    init();

    runBtn.addEventListener('click', () => {
        outEl.innerHTML = '';
        if (mode === 'pyodide') {
            pyodide.runPythonAsync(codeEl.value).catch(e => {
                outEl.innerHTML += `<span class="error">${e}</span>\n`;
            });
        } else {
            runSimulation();
        }
    });
</script>

</body>
</html>
